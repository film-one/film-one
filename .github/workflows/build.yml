name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --console=plain --warning-mode=none
      - uses: actions/upload-artifact@v4
        with:
          name: film-one-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
